# Render.com blueprint — FinLLM backend
# Postgres: Neon (https://console.neon.tech) — DATABASE_URL elle eklenir
#
# Kullanım:
#   1. Neon'da yeni project: pooled connection string'i kopyala
#   2. Render → New → Blueprint → bu repo'yu seç
#   3. Render UI'da Environment Group "finllm-secrets" oluştur ve
#      şu env vars'ı doldur:
#        - DATABASE_URL  (Neon pooled connection)
#        - ANTHROPIC_API_KEY
#        - FINNHUB_API_KEY      (opsiyonel)
#        - TELEGRAM_BOT_TOKEN   (opsiyonel)
#        - TELEGRAM_CHANNEL_NASDAQ
#        - TELEGRAM_CHANNEL_BIST
#   4. Deploy

services:
  # ---- FastAPI gateway (API service) ----
  - type: web
    name: finllm-api
    runtime: docker
    branch: main
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    region: frankfurt
    plan: starter  # $7/ay web service, 512MB RAM
    envVars:
      - key: MODE
        value: api
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: FINNHUB_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHANNEL_NASDAQ
        sync: false
      - key: TELEGRAM_CHANNEL_BIST
        sync: false
      - key: DATABASE_URL
        sync: false  # Neon pooled connection — Render UI'dan ekle
      - key: API_BEARER_TOKEN
        generateValue: true
      - key: PUBLIC_READ
        value: "true"
      - key: ENV
        value: production
    healthCheckPath: /v2/health

  # ---- Telegram DM bot (long-running worker) ----
  - type: worker
    name: finllm-telegram-dm
    runtime: docker
    branch: main
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    region: frankfurt
    plan: starter
    envVars:
      - key: MODE
        value: worker
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: ENV
        value: production
    dockerCommand: python /app/scripts/telegram_dm_bot.py

  # ---- Cron: NASDAQ pre-market ----
  - type: cron
    name: finllm-cron-nasdaq
    runtime: docker
    branch: main
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    region: frankfurt
    plan: starter
    # 04:00 ET ≈ 09:00 UTC, NYSE pre-market (hafta içi)
    schedule: "0 9 * * 1-5"
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: FINNHUB_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHANNEL_NASDAQ
        sync: false
      - key: DATABASE_URL
        sync: false
    dockerCommand: python /app/scripts/run_funnel.py --market nasdaq --llm claude --mode pre_market

  # ---- Cron: BIST pre-market ----
  - type: cron
    name: finllm-cron-bist
    runtime: docker
    branch: main
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    region: frankfurt
    plan: starter
    # 09:30 TR ≈ 06:30 UTC, BIST pre-market (hafta içi)
    schedule: "30 6 * * 1-5"
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHANNEL_BIST
        sync: false
      - key: DATABASE_URL
        sync: false
    dockerCommand: python /app/scripts/run_funnel.py --market bist --llm claude --mode pre_market

  # ---- Cron: günlük outcome update + Platt retrain ----
  - type: cron
    name: finllm-cron-outcomes
    runtime: docker
    branch: main
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    region: frankfurt
    plan: starter
    schedule: "0 18 * * *"
    envVars:
      - key: DATABASE_URL
        sync: false
    dockerCommand: python /app/scripts/update_outcomes.py
