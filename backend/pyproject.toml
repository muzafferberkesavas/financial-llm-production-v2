[project]
name = "finllm"
version = "0.1.0"
description = "Hybrid LLM + quant swing-trading signal system (US equities, BIST later)"
requires-python = ">=3.11"
dependencies = [
    # Core data
    "pandas>=2.2",
    "numpy>=1.26,<2.3",
    "polars>=1.0",
    "pyarrow>=15.0",
    "duckdb>=1.0",
    "sqlalchemy>=2.0",

    # Market & news data
    "yfinance>=0.2.50",
    "finnhub-python>=2.4",
    "requests>=2.32",
    "httpx>=0.27",
    "tenacity>=9.0",

    # Features / technicals
    "pandas-ta>=0.3.14b",
    "scikit-learn>=1.5",

    # NLP / sentiment
    "transformers>=4.45",
    "torch>=2.4",
    "sentencepiece>=0.2",
    "accelerate>=1.0",

    # LLM clients
    "anthropic>=0.40",
    "openai>=1.50",

    # API server (dashboard backend)
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",

    # Utilities
    "python-dotenv>=1.0",
    "rich>=13.9",
    "loguru>=0.7",
    "tqdm>=4.66",
]

[project.optional-dependencies]
qlib = [
    # Qlib'i ayrı kuruyoruz — kurulumu trickyolduğu için
    "pyqlib>=0.9.5",
    "lightgbm>=4.5",
    "xgboost>=2.1",
]
backtest = [
    "vectorbt>=0.26",
    "quantstats>=0.0.62",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
    "ipykernel>=6.29",
    "jupyter>=1.1",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "W", "UP", "N", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
